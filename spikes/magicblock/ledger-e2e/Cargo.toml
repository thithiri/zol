[package]
name = "ledger-e2e"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: spikes/ is excluded from the root workspace.
[workspace]

[dependencies]
anchor-lang = "1.2.1"
zol-ledger = { path = "../../../programs/zol-ledger", features = ["no-entrypoint"] }
zol-test-app = { path = "../../../programs/zol-test-app", features = ["no-entrypoint"] }
zol-wire = { path = "../../../crates/zol-wire" }
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = { version = "4", features = ["serde", "wincode"] }
solana-message = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-hash = "4"
solana-ed25519-program = "3"
ed25519-dalek = "2"
bincode = "1"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
rand = "0.8"
