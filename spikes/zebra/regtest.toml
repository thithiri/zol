# Zebra 6.4.2 regtest config for ZOL spikes (0.2 / 0.11).
# Mounted read-only at /etc/zebra/regtest.toml. Env vars ZEBRA_SECTION__KEY override it.

[network]
network = "Regtest"
# Fixed P2P port so a second node can be added with the `addnode` RPC. Zebra treats
# 18233 as the Regtest port (it warns "invalid peer port" for zcashd's 18344).
listen_addr = "0.0.0.0:18233"
# Regtest only dials *localhost* initial peers (zebra-network/src/config.rs:266),
# so cross-container peering is done with `addnode` (regtest-only RPC) instead.
initial_testnet_peers = []

# Zebra's Regtest leaves NU5+ inactive unless configured
# (zebra-chain/src/parameters/network/testnet.rs `for_regtest`). Activate everything
# that is live on mainnet at height 1, so Orchard + ZIP 244/317 rules apply from block 1.
[network.testnet_parameters.activation_heights]
NU5 = 1
NU6 = 1
"NU6.1" = 1
"NU6.2" = 1
"NU6.3" = 1

[mining]
# Regtest transparent address from the Zebra book (book/src/user/regtest.md).
miner_address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v"
internal_miner = false

[rpc]
listen_addr = "0.0.0.0:18232"
enable_cookie_auth = false

[state]
# Throwaway chain: nothing is written to disk beyond a temp dir inside the container.
ephemeral = true

[mempool]
# Accept transactions from height 0 on regtest (no sync gate).
debug_enable_at_height = 0

[tracing]
use_color = false
