# Zebra 7 regtest with NU7 active at height 1 (docs/ops/nu7.md). Runs beside the 6.4.2 pair
# (docker-compose.yml) on its own ports, containers and p2p network:
#   ZOL_ZEBRA=zebra7 scripts/up.sh [a|pair]   (scripts read ZOL_ZEBRA to pick this file)
#   RPC: a http://127.0.0.1:18272/  b http://127.0.0.1:18282/
name: zol-zebra7

x-zebra: &zebra
  # zebrad v7.0.0-rc.0 (git 6d1e414, 2026-10-02), pinned by digest.
  image: zfnd/zebra:7.0.0-rc.0@sha256:d534756d899bc44ce0c7ad6d1672a540d0eb588f8c2face4674298ebb091abca
  command: ["zebrad", "-c", "/etc/zebra/regtest.toml", "start"]
  volumes:
    - ./regtest-nu7.toml:/etc/zebra/regtest.toml:ro
  environment:
    ZEBRA_TRACING__FILTER: "info"
  networks: [p2p]
  restart: "no"

services:
  zebra-a:
    <<: *zebra
    container_name: zol-zebra7-a
    ports:
      - "127.0.0.1:${ZOL_ZEBRA7_RPC_PORT:-18272}:18232"

  zebra-b:
    <<: *zebra
    container_name: zol-zebra7-b
    profiles: ["pair"]
    ports:
      - "127.0.0.1:${ZOL_ZEBRA7_B_RPC_PORT:-18282}:18232"

networks:
  p2p:
    name: zol-zebra7-p2p
