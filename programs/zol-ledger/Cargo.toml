[package]
name = "zol-ledger"
version = "0.3.0"
description = "ZOL kernel ledger: deposits, balances, pots, settlements"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "zol_ledger"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Local development only: short activation-delay and refund-grace floors so local
# stacks do not wait an hour. Never in a release build; signers pin the release hash,
# and a dev build refuses to initialize for mainnet.
dev-timings = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
ephemeral-rollups-sdk = { workspace = true }
zol-wire = { workspace = true }
solana-sha256-hasher = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
