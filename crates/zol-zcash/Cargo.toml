# ZOL Zcash side: per-app vault keys, node RPC, Ironwood scanner, refund and genesis
# builders, FROST spend authorization. The Zcash crate stack is pinned exactly.
# Its own workspace: pczt 0.9.3 needs a sha2 0.11 pre-release that cannot share a
# build with anchor-lang 1.2, so the gateway talks to it as a separate process.
[workspace]

[package]
name = "zol-zcash"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "UNLICENSED"
publish = false
description = "ZOL gateway Zcash layer (Ironwood / NU6.3)"

[dependencies]
zol-wire = { path = "../zol-wire" }
zol-types = { path = "../zol-types" }

# Pinned, coherent Zcash stack: the NU7 (ZIP 259) pre-releases and what they require.
# The RedPallas FROST ciphersuite is our own (src/redpallas.rs) on frost-core 3.0: reddsa 0.6
# dropped its `frost` feature, and the ZF frost repository has not published RedPallas yet.
orchard = { version = "=0.16.0", features = ["circuit"] }
reddsa = "=0.6.1"
frost-core = { version = "=3.0.0", features = ["serialization"] }
frost-rerandomized = { version = "=3.0.0", features = ["serialization"] }
pczt = { version = "=0.10.0-pre.1", features = ["orchard", "io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor", "zcp-builder"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_protocol = { version = "=0.11.0-pre.0", features = ["local-consensus"] }
zcash_address = "=0.14.0-pre.1"
zcash_note_encryption = "=0.5.1"
incrementalmerkletree = "=0.9.0"
shardtree = "=0.8.0"
pasta_curves = "=0.6.1"
ff = "0.14"
group = "0.14"
# rand 0.10 / rand_core 0.10 for orchard, pczt and pasta_curves; rand 0.8 / rand_core 0.6
# for frost-core 3.0 (and the deterministic dev-key derivation, which must not change).
rand10 = { package = "rand", version = "0.10" }
rand_core10 = { package = "rand_core", version = "0.10" }
blake2b_simd = "1"
blake3 = "1.8"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# zol-zcashd
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "signal"] }
toml = "0.8"
rand_chacha = "0.3"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
# The reference for tests/frost_equivalence.rs: our ciphersuite must match reddsa 0.5.2's
# FROST byte for byte (keys, nonces, commitments, shares, signatures).
reddsa05 = { package = "reddsa", version = "=0.5.2", features = ["frost"] }
pasta_curves05 = { package = "pasta_curves", version = "=0.5.2" }

[profile.dev]
opt-level = 1

# Halo2 proving is very slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
