[package]
name = "zol-wire"
version = "0.3.0"
description = "ZOL wire formats: deposit/head/top-up memos, attestation digests, keyed identifiers"
edition.workspace = true
license.workspace = true

[features]
default = ["std", "sha2", "keyed", "ed25519"]
std = []
# Default SHA-256 hasher for host code. On-chain code supplies the syscall hasher instead.
sha2 = ["dep:sha2"]
# Gateway-side keyed identifiers (deposit ID, payout commitment). Never used on-chain.
keyed = ["dep:blake2b_simd"]
# Session-key signature verification for deposit memos (gateway side).
ed25519 = ["dep:ed25519-dalek"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }
blake2b_simd = { version = "1", default-features = false, optional = true }
ed25519-dalek = { version = "2", default-features = false, optional = true }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
