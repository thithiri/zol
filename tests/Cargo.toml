[package]
name = "zol-tests"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version = "1.97"
publish = false

[dependencies]
anchor-lang = { workspace = true }
zol-ledger = { path = "../programs/zol-ledger", features = ["no-entrypoint"] }
zol-test-app = { path = "../programs/zol-test-app", features = ["no-entrypoint"] }
zol-coinflip = { path = "../programs/zol-coinflip", features = ["no-entrypoint"] }
zol-wire = { path = "../crates/zol-wire" }
litesvm = { version = "0.18", features = ["precompiles"] }
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = "4"
solana-message = "4"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-clock = "3"
solana-ed25519-program = "3"
solana-loader-v3-interface = "6"
solana-sdk-ids = "3"
ed25519-dalek = "2"
bincode = "1"
proptest = "1"
rand = "0.8"
solana-transaction-error = "3"
serde_json = "1"
base64 = "0.22"
