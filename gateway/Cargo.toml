[package]
name = "zol-gateway"
version = "0.3.0"
description = "ZOL gateway: deposit decisions, threshold attestation, reconciliation, guardians, halt"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zol-wire = { path = "../crates/zol-wire" }
zol-ledger = { path = "../programs/zol-ledger", features = ["no-entrypoint"] }
anchor-lang = { workspace = true }
frost-ed25519 = "3.0.0"
ed25519-dalek = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rand = "0.8"
blake2b_simd = "1"
hex = "0.4"
zol-types = { path = "../crates/zol-types" }
pasta_curves = "0.5"
group = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
sha2 = "0.10"
url = "2"
base64 = "0.22"
bs58 = "0.5"
bincode = "1"
solana-transaction = { version = "4", features = ["wincode", "serde"] }
solana-message = "4"
solana-keypair = "3.1"
solana-signer = "3"
solana-instruction = "3"
solana-ed25519-program = "3"
solana-hash = "4"

[dev-dependencies]
solana-signer = "3"
zol-tests = { path = "../tests" }
solana-pubkey = "4"
proptest = "1"
