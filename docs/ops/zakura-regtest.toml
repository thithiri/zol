# Zakura 1.6.0 regtest node for the ZOL regtest suites (docs/ops/zcash-node.md).
# Mirrors spikes/zebra/regtest.toml. Zakura has no `generatetoaddress`, so dev funding
# uses `generate`, which pays [mining] miner_address: that is the dev wallet UA of
# dev seed "zol-zakura" (`zol-zcashd --print-dev-keys --dev-seed zol-zakura`).
# Run the suites with ZOL_DEV_SEED=zol-zakura.

[network]
network = "Regtest"
listen_addr = "0.0.0.0:18233"
initial_testnet_peers = []
cache_dir = false

# Zakura enforces the one-time NU6.1 lockbox disbursement in the NU6.1 activation block's
# coinbase even on regtest (zakura-consensus block/check.rs; Zebra 6.4.2 did not), and
# regtest defaults to none, so `generate` fails with "missing lockbox disbursements for
# NU6.1 activation block". A zero-value P2SH output satisfies the rule (the same trick as
# Zakura's local_genesis.rs); the address is the Zebra book's regtest P2SH address.
[network.testnet_parameters]
lockbox_disbursements = [{ address = "t27eWDgjFYJGVXmzrXeVjnb5J3uXDM9xH9v", amount = 0 }]

[network.testnet_parameters.activation_heights]
NU5 = 1
NU6 = 1
"NU6.1" = 1
"NU6.2" = 1
"NU6.3" = 1

[mining]
miner_address = "uregtest1jzaluyyc2r48gag7uezq9recsl3vmnv5twddry0gdzn82xzq95ldanz7tagufnkrvvq5jtnmhg7cmupercgmhvl27smgpprdzshqjxmq"
internal_miner = false

[rpc]
listen_addr = "0.0.0.0:18232"
enable_cookie_auth = false

[state]
ephemeral = true

[mempool]
debug_enable_at_height = 0

[tracing]
use_color = false
