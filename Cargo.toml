[workspace]
resolver = "3"
members = [
    "crates/zol-wire",
    "programs/zol-ledger",
    "programs/zol-test-app",
    "tests",
]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
zol-wire = { path = "crates/zol-wire", default-features = false }
anchor-lang = "1.2.1"
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
