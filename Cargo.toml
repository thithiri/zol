[workspace]
resolver = "3"
members = [
    "crates/zol-wire",
    "programs/zol-ledger",
    "programs/zol-test-app",
    "tests",
    "gateway",
    "crates/zol-types",
]
# zol-zcash pins pczt 0.9.3, whose sha2 0.11 pre-release cannot share a build with
# anchor-lang 1.2 (sha2 0.11): it is its own workspace and runs as the zol-zcashd process.
exclude = ["spikes", "crates/zol-zcash"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
zol-wire = { path = "crates/zol-wire", default-features = false }
anchor-lang = "1.2.1"
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
